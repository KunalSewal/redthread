[project]
name = "redthread"
version = "0.1.0"
description = "Agentic fraud investigation on TigerGraph"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyTigerGraph==2.0.4",
    "tigergraph-mcp==1.0.3",
    "google-genai>=1.0",
    "langgraph>=1.0",
    "mcp>=1.0",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the dataset in data/ (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
